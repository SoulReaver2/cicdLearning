name: Mon Super Pipeline PHP

on: [push] # Déclencheur : n'importe quel push sur le repo

jobs:
  run-tests:
    runs-on: ubuntu-latest # Le type de serveur qui va bosser

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Installer les dépendances
        run: composer install

      - name: Lancer les tests
        run: ./vendor/bin/phpunit tests

  deploy:
    needs: run-tests # <--- TRÈS IMPORTANT : ne se lance que si run-tests est vert
    runs-on: ubuntu-latest
    steps:
      - name: Simulation du déploiement
        run: |
          echo "🚀 Connexion au serveur de production..."
          echo "📦 Récupération du code validé..."
          echo "✅ Application déployée avec succès sur http://mon-app-tva.com"
