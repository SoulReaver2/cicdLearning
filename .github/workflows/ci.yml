name: Mon Super Pipeline PHP

on: [push] # Déclencheur : n'importe quel push sur le repo

jobs:
  run-tests:
    runs-on: ubuntu-latest # Le type de serveur qui va bosser

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Installer les dépendances
        run: composer install

      - name: Lancer les tests
        run: ./vendor/bin/phpunit tests

  deploy:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances (sans dev)
        run: composer install --no-dev

      - name: Déploiement via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22 # Le port standard pour SFTP
          local_path: "./" # Tout ton dossier actuel
          remote_path: "cicdphp" # <--- VÉRIFIE CE CHEMIN !
          delete_remote_files: false
