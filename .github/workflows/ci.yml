name: Mon Super Pipeline PHP

on: [push] # Déclencheur : n'importe quel push sur le repo

jobs:
  run-tests:
    runs-on: ubuntu-latest # Le type de serveur qui va bosser

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Installer les dépendances
        run: composer install

      - name: Lancer les tests
        run: ./vendor/bin/phpunit tests

  deploy:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances (sans les outils de test)
        run: composer install --no-dev # On n'envoie pas PHPUnit en prod !

      - name: Déploiement via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./cicdphp/ # Le dossier sur ton hébergement
